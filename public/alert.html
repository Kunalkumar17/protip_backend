<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tip Alert</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:transparent;
  overflow:hidden;
  font-family:Inter, Segoe UI, system-ui, sans-serif;
}

/* container animation */
#alert-container{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%, -50%) scale(.85);
  opacity:0;
  visibility:hidden;
  transition:all .35s cubic-bezier(.2,.8,.2,1);
}

#alert-container.show{
  transform:translate(-50%, -50%) scale(1);
  opacity:1;
  visibility:visible;
}

/* alert card */
.alert-box{
  min-width:420px;
  max-width:650px;

  padding:34px 48px;

  border-radius:22px;

  background:rgba(255,255,255,.96);

  box-shadow:
    0 10px 40px rgba(0,0,0,.22);

  text-align:center;

  position:relative;
}

/* name */
#tipper-name{
  font-size:34px;
  font-weight:700;
  color:#111827;
  letter-spacing:.3px;
}

/* line */
.line-wrapper{
  width:100%;
  display:flex;
  justify-content:center;
  margin:18px 0 18px;
}

.animated-line{
  height:3px;
  width:0;
  background:#000;
  border-radius:999px;
}

/* animate line when alert shows */
#alert-container.show .animated-line{
  animation:
    lineOpen 1s ease forwards,
    lineClose 1s ease forwards 5s;
}

/* message */
#tip-message{
  font-size:24px;
  color:#374151;
  line-height:1.5;
  font-style:italic;
  word-break:break-word;
}

/* line animations */
@keyframes lineOpen{
  from{
    width:0;
  }
  to{
    width:100%;
  }
}

@keyframes lineClose{
  from{
    width:100%;
  }
  to{
    width:0;
  }
}

/* sparkle */
.sparkle,.confetti{
  position:absolute;
}

.sparkle{
  width:14px;
  height:14px;
  background:white;
  opacity:.9;
  clip-path:polygon(
    50% 0%,61% 35%,98% 35%,
    68% 57%,79% 91%,50% 70%,
    21% 91%,32% 57%,2% 35%,39% 35%
  );
  animation:sparkle 2s forwards;
}

@keyframes sparkle{
  0%{opacity:0;transform:scale(.5)}
  40%{opacity:1}
  100%{opacity:0;transform:translateY(-120px) scale(1.2)}
}

/* confetti */
.confetti{
  width:8px;
  height:12px;
  border-radius:2px;
  animation:fall 3s forwards;
}

@keyframes fall{
  0%{opacity:1;transform:translateY(-40px)}
  100%{opacity:0;transform:translateY(650px) rotate(720deg)}
}
</style>
</head>

<body>

<div id="alert-container">
  <div class="alert-box">

    <div id="tipper-name">Anonymous tipped</div>

    <div class="line-wrapper">
      <div class="animated-line"></div>
    </div>

    <div id="tip-message"></div>

  </div>
</div>

<script>
let isPlaying=false;
const queue=[];

function sparkles(){
  const box=document.querySelector(".alert-box");
  for(let i=0;i<15;i++){
    const s=document.createElement("div");
    s.className="sparkle";
    s.style.left=Math.random()*100+"%";
    box.appendChild(s);
    setTimeout(()=>s.remove(),2000);
  }
}

function speakTip(tip) {
  return new Promise((resolve) => {

    if (!("speechSynthesis" in window)) {
      resolve();
      return;
    }

    const text =
      `${tip.user || tip.name || "Someone"} tipped ${tip.currency?.toUpperCase() || ""} ${tip.amount}. ` +
      (tip.message ? tip.message : "");

    const speech = new SpeechSynthesisUtterance(text);

    speech.rate = 1;
    speech.pitch = 1;
    speech.volume = 1;

    speech.onend = resolve;

    const voices = speechSynthesis.getVoices();
    if (voices.length) speech.voice = voices[0];

    if(tip.amount >= 100 || (tip.currency != "inr" && tip.amount > 2)){
      speechSynthesis.speak(speech);
    } else {
      resolve();
    }

  });
}

async function play(tip){

  isPlaying = true;

    let symbol = "₹";
  if(tip.currency === "usd") symbol = "$";
  else if(tip.currency === "aud") symbol = "A$";

  document.getElementById("tipper-name").textContent =
    `${tip.user || tip.name || "Anonymous"} tipped ${symbol}${Number(tip.amount || 0).toFixed(2)}`;

  const msg = document.getElementById("tip-message");


  msg.textContent =
    `${tip.message || ""}`;

  const el = document.getElementById("alert-container");

  /* restart line animation */
  const line = document.querySelector(".animated-line");
  line.style.animation = "none";
  void line.offsetWidth;
  line.style.animation = "";

  el.classList.add("show");

  // sparkles();
  // confetti();

  // await speakTip(tip);

  setTimeout(()=>{
    el.classList.remove("show");
    isPlaying = false;
    next();
  },6000);
}

function next(){
  if(queue.length && !isPlaying) play(queue.shift());
}

function showAlert(tip){
  queue.push(tip);
  next();
}

/* websocket */

function connect(){
  const ws=new WebSocket(
    (location.protocol==="https:"?"wss://":"ws://")+location.host
  );

  ws.onmessage = (e) => {
    const data = JSON.parse(e.data);

    if (data.type === "tipAlert") {
      showAlert(data);
    }
  };

  ws.onclose=()=>setTimeout(connect,3000);
}

connect();
</script>

</body>
</html>
